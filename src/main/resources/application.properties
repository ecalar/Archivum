spring.application.name=archivum
spring.main.web-application-type=none

# ==========================================
# BASE DE DATOS H2
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/archivum
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ==========================================
# HIBERNATE / JPA
# ==========================================
# 'update' garantiza que la base de datos no se formatee al reiniciar el programa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==========================================
# SISTEMA DE ARCHIVOS ARCHIVUM
# ==========================================
app.archivos.ruta=./archivos
app.backup.ruta=./backups

# ==========================================
# MOTOR OCR (Tess4J)
# ==========================================
app.ocr.enabled=true
app.ocr.idioma=spa
app.ocr.ruta-tesseract=/usr/bin/tesseract